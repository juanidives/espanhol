<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apuesto que sí · Alumno A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--rojo:#C8102E;--rojo-osc:#8F0A1F;--grafito:#1F2226;--gris:#555B63;--fondo:#F2F3F5;--blanco:#fff;--verde:#1B7A3D;
  --display:"Archivo","Arial Black",Arial,sans-serif;--texto:"Atkinson Hyperlegible",Verdana,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--texto);color:var(--grafito);background:var(--blanco);font-size:20px;line-height:1.3;
  -webkit-tap-highlight-color:transparent}
#app{height:100%;min-height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--display);font-weight:800;font-size:17px}
.top .quien{background:var(--grafito);color:var(--blanco);padding:4px 12px;border-radius:6px}
.top .ronda{color:var(--rojo)}
.puntos{display:flex;gap:7px}
.puntos i{width:16px;height:16px;border-radius:50%;border:3px solid var(--grafito);display:block}
.puntos i.ok{background:var(--verde);border-color:var(--verde)}
.puntos i.no{background:var(--rojo);border-color:var(--rojo)}
.puntos i.act{background:var(--grafito)}
.pantalla{display:none;flex:1;min-height:0;flex-direction:column;gap:12px;padding-top:12px}
.pantalla.on{display:flex}
.marco{flex:1;min-height:0;display:grid;place-items:center;container-type:size}
.foto{height:100%;max-width:100%;aspect-ratio:4/5;display:grid;place-items:center;background:var(--fondo);border-radius:14px;overflow:hidden;
  box-shadow:0 4px 16px rgba(31,34,38,.3)}
@supports (width:1cqw){.foto{height:auto;max-width:none;width:min(100cqw,calc(100cqh * .8))}}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto.noimg img{display:none}
.foto.noimg::before{content:attr(data-emoji);font-size:min(46vw,210px);line-height:1}
.frase{font-family:var(--display);font-weight:900;font-size:clamp(27px,8vw,40px);line-height:1.06;text-align:center;text-wrap:balance;min-height:2.2em;
  display:grid;place-items:center}
.guia{text-align:center;color:var(--gris);font-size:19px}
.botones{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font-family:var(--display);font-weight:900;font-size:24px;min-height:74px;border-radius:14px;border:4px solid var(--grafito);
  background:var(--blanco);color:var(--grafito);cursor:pointer;padding:8px 10px;line-height:1.05}
button:active{transform:scale(.97)}
button:focus-visible{outline:4px solid #FFB000;outline-offset:2px}
button .ico{display:block;font-size:34px;line-height:1.1}
.si{border-color:var(--verde);color:var(--verde)}
.nunca{border-color:var(--rojo);color:var(--rojo)}
.lleno{background:var(--rojo);border-color:var(--rojo);color:var(--blanco);width:100%}
.ayuda{font-size:19px;min-height:56px;border-width:3px;border-style:dashed;color:var(--gris);border-color:var(--gris);font-weight:800}
.centro{justify-content:center;align-items:center;text-align:center;gap:18px}
.titulo{font-family:var(--display);font-weight:900;font-size:clamp(40px,12vw,58px);line-height:1}
.letra{font-family:var(--display);font-weight:900;font-size:120px;line-height:1;color:var(--rojo)}
.resultado{font-family:var(--display);font-weight:900;font-size:clamp(34px,10vw,48px);line-height:1.05}
.resultado.ok{color:var(--verde)} .resultado.no{color:var(--rojo)}
.marca{font-size:110px;line-height:1}
.total{font-family:var(--display);font-weight:900;font-size:clamp(30px,9vw,44px);line-height:1.1}
.total b{color:var(--rojo);font-size:1.6em}
.sub{font-size:22px;color:var(--gris)}
.frase[hidden],button[hidden]{display:none}
</style>
</head>
<body>
<div id="app">
  <div class="top"><span class="quien">Alumno A</span><span class="ronda" id="ronda"></span><span class="puntos" id="puntos" aria-hidden="true"></span></div>

  <section class="pantalla centro" id="p-inicio">
    <div class="letra">A</div>
    <h1 class="titulo">Apuesto que sí</h1>
    <button class="lleno" id="b-empezar" type="button">Empezar</button>
  </section>

  <section class="pantalla" id="p-apuesta">
    <div class="marco"><div class="foto" id="foto1"><img alt=""></div></div>
    <p class="guia">¿Tu compañero lo ha hecho? Apuesta.</p>
    <div class="botones">
      <button class="si" type="button" data-apuesta="1"><span class="ico">👍</span>Sí</button>
      <button class="nunca" type="button" data-apuesta="0"><span class="ico">👎</span>Nunca</button>
    </div>
  </section>

  <section class="pantalla" id="p-pregunta">
    <div class="marco"><div class="foto" id="foto2"><img alt=""></div></div>
    <p class="frase" id="frase"></p>
    <button class="ayuda" id="b-ayuda" type="button" hidden>Ver la frase</button>
    <p class="guia">Pregunta. ¿Qué responde?</p>
    <div class="botones">
      <button class="si" type="button" data-resp="1">Sí, he…</button>
      <button class="nunca" type="button" data-resp="0">No, nunca</button>
    </div>
  </section>

  <section class="pantalla centro" id="p-resultado">
    <div class="marca" id="marca"></div>
    <p class="resultado" id="resultado"></p>
    <p class="sub">Ahora pregunta tu compañero.</p>
    <button class="lleno" id="b-sig" type="button">Siguiente</button>
  </section>

  <section class="pantalla centro" id="p-final">
    <p class="total">Has acertado<br><b id="aciertos"></b> de 5</p>
    <p class="sub" id="final-sub"></p>
    <button class="lleno" id="b-ronda" type="button"></button>
  </section>
</div>
<script>
(function(){
  var CARTAS = [{"img": "a1-cavalo.png", "emoji": "🐴", "frase": "¿Alguna vez has montado a caballo?"}, {"img": "a2-neve.png", "emoji": "❄️", "frase": "¿Alguna vez has visto la nieve?"}, {"img": "a3-aviao.png", "emoji": "✈️", "frase": "¿Alguna vez has viajado en avión?"}, {"img": "a4-celular.png", "emoji": "📱", "frase": "¿Alguna vez has roto un celular?"}, {"img": "a5-sushi.png", "emoji": "🍣", "frase": "¿Alguna vez has comido sushi?"}];
  var ronda = 1, n = 0, apuesta = null, marcas = [];
  var $ = function(id){ return document.getElementById(id); };
  function pantalla(id){
    document.querySelectorAll('.pantalla').forEach(function(p){ p.classList.toggle('on', p.id === id); });
  }
  function pintarPuntos(){
    var h = '';
    for (var k = 0; k < CARTAS.length; k++){
      var c = marcas[k] === true ? 'ok' : marcas[k] === false ? 'no' : (k === n ? 'act' : '');
      h += '<i class="' + c + '"></i>';
    }
    $('puntos').innerHTML = h;
    $('ronda').textContent = 'Ronda ' + ronda;
  }
  function ponerFoto(id){
    var f = $(id), img = f.querySelector('img'), c = CARTAS[n];
    f.classList.remove('noimg'); f.setAttribute('data-emoji', c.emoji);
    img.onerror = function(){ f.classList.add('noimg'); };
    img.alt = c.frase; img.src = 'images/' + c.img;
  }
  function carta(){
    apuesta = null; pintarPuntos(); ponerFoto('foto1'); pantalla('p-apuesta');
  }
  function pregunta(){
    ponerFoto('foto2');
    var sinFrase = ronda > 1;
    $('frase').textContent = sinFrase ? '' : CARTAS[n].frase;
    $('frase').hidden = sinFrase;
    $('b-ayuda').hidden = !sinFrase;
    pantalla('p-pregunta');
  }
  function resultado(resp){
    var ok = (resp === apuesta); marcas[n] = ok; pintarPuntos();
    $('marca').textContent = ok ? '✅' : '❌';
    $('resultado').textContent = ok ? '¡Has acertado!' : 'No has acertado';
    $('resultado').className = 'resultado ' + (ok ? 'ok' : 'no');
    $('b-sig').textContent = (n === CARTAS.length - 1) ? 'Ver resultado' : 'Siguiente';
    pantalla('p-resultado');
  }
  function fin(){
    $('aciertos').textContent = marcas.filter(function(m){ return m === true; }).length;
    $('final-sub').textContent = 'Cambia de pareja.';
    $('b-ronda').textContent = (ronda === 1) ? 'Ronda 2: sin frase' : 'Otra ronda';
    pantalla('p-final');
  }
  function empezar(){ n = 0; marcas = []; carta(); }

  $('b-empezar').addEventListener('click', empezar);
  document.querySelectorAll('[data-apuesta]').forEach(function(b){
    b.addEventListener('click', function(){ apuesta = b.getAttribute('data-apuesta') === '1'; pregunta(); });
  });
  document.querySelectorAll('[data-resp]').forEach(function(b){
    b.addEventListener('click', function(){ resultado(b.getAttribute('data-resp') === '1'); });
  });
  $('b-ayuda').addEventListener('click', function(){
    $('frase').textContent = CARTAS[n].frase; $('frase').hidden = false; $('b-ayuda').hidden = true;
  });
  $('b-sig').addEventListener('click', function(){
    if (n === CARTAS.length - 1) fin(); else { n++; carta(); }
  });
  $('b-ronda').addEventListener('click', function(){ ronda++; empezar(); });

  $('ronda').textContent = '';
  pantalla('p-inicio');
})();
</script>
</body>
</html>
